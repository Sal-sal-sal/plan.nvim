name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build release engine
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match Cargo.toml'
          PY
          rustup toolchain install stable --profile minimal
          rustup override set stable
          cargo build --release --locked
          ./target/release/plan-nvim --version
      - name: Package binary
        env:
          TARGET_NAME: ${{ matrix.target }}
        run: |
          package="plan-nvim-$GITHUB_REF_NAME-$TARGET_NAME"
          mkdir -p "dist/$package"
          cp target/release/plan-nvim LICENSE README.md "dist/$package/"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          for archive in Path('dist').glob('*.tar.gz'):
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              archive.with_suffix(archive.suffix + '.sha256').write_text(f'{digest}  {archive.name}\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: engine-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
          fi
