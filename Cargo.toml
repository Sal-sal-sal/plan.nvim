[package]
name = "plan-nvim"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Rust engine for the plan.nvim plain-text planning plugin"
license = "MIT"
repository = "https://github.com/Sal-sal-sal/plan.nvim"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
